<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetRem · Live demo</title>
<meta name="description" content="Track your pets' vaccinations, medications and care routines in one place.">
<meta name="theme-color" content="#1f8a70">
<link rel="icon" href="static/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<div id="app"><div class="boot"><span class="spinner" aria-hidden="true"></span><span class="msg">Loading PetRem…</span></div></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<a class="live-badge" href="https://github.com/vinovj27/Petrem-app" target="_blank" rel="noopener">
  <span class="live-dot"></span>Live demo · runs in your browser · view source</a>
<style>
  .live-badge { position: fixed; left: 16px; bottom: 16px; z-index: 45; display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 99px; background: var(--ink); color: var(--bg); font: 700 13px var(--body);
    text-decoration: none; box-shadow: var(--shadow); opacity: .92; }
  .live-badge:hover { opacity: 1; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sun); }
  @media (max-width: 720px) { .live-badge { display: none; } }
</style>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="live.js"></script>
<script src="static/app.js"></script>
</body>
</html>
